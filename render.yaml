services:
  # ── API Server ──────────────────────────────────────────────────────────────
  - type: web
    name: pulsetix-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulsetix-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pulsetix-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: ORGANIZER_SIGNUP_CODE
        sync: false   # set manually in Render dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_RATE_PER_SEC
        value: "10"
      - key: OUTBOX_POLL_MS
        value: "1000"
      - key: OUTBOX_BATCH_SIZE
        value: "100"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: BOOKING_RATE_LIMIT_PER_MIN
        value: "60"
      - key: METRICS_TOKEN
        generateValue: true
      - key: ENABLE_NAIVE
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: DB_POOL_MAX
        value: "10"

  # ── Background Worker ───────────────────────────────────────────────────────
  - type: worker
    name: pulsetix-worker
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulsetix-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pulsetix-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          name: pulsetix-api
          type: web
          envVarKey: JWT_SECRET
      - key: ORGANIZER_SIGNUP_CODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_RATE_PER_SEC
        value: "10"
      - key: OUTBOX_POLL_MS
        value: "1000"
      - key: OUTBOX_BATCH_SIZE
        value: "100"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ENABLE_NAIVE
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: DB_POOL_MAX
        value: "5"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: METRICS_TOKEN
        value: unused
      - key: BOOKING_RATE_LIMIT_PER_MIN
        value: "60"

databases:
  - name: pulsetix-db
    databaseName: pulsetix
    plan: free
    region: oregon

  - name: pulsetix-redis
    plan: free
    region: oregon
